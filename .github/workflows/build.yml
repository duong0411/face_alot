name: Build APK & IPA + Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: face-alot-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/face_alot-${GITHUB_REF_NAME}.apk"
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }} — Face AIoT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install CocoaPods deps (face_ncnn + ncnn)
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
      - run: flutter build ios --release --no-codesign
      - name: Pack unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "face_alot-${GITHUB_REF_NAME:-unsigned}-ios.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: face-alot-ipa-unsigned
          path: '*.ipa'
      - name: Attach IPA to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: face_alot-*-ios.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
