name: Build APK & IPA + Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: face-alot-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/face_alot-${GITHUB_REF_NAME}.apk"
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }} — Face AIoT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install CocoaPods deps (face_ncnn + ncnn)
        run: |
          flutter pub get
          flutter config --no-enable-swift-package-manager || true
          cd ios
          pod install --verbose
      - run: flutter build ios --release --no-codesign
      - name: Verify face_ncnn_init is linked
        run: |
          set -e
          BIN="build/ios/iphoneos/Runner.app/Runner"
          echo "Binary size: $(wc -c < "$BIN") bytes"
          nm -gU "$BIN" | grep -E 'face_ncnn_init|face_ncnn_detect' || true
          # Also search string table (Release may strip some nm visibility)
          if ! strings "$BIN" | grep -q 'face_ncnn_init'; then
            echo "ERROR: face_ncnn_init not found in Runner — C++ sources were not linked"
            # Show what from face_ncnn did link
            strings "$BIN" | grep -i face_ncnn | head -50 || true
            exit 1
          fi
          # Expect a much larger binary once ncnn static libs are pulled in
          SIZE=$(wc -c < "$BIN")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: Runner binary too small ($SIZE) — ncnn likely not linked"
            exit 1
          fi
          echo "OK: face_ncnn symbols present, size=$SIZE"
      - name: Pack unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "face_alot-${GITHUB_REF_NAME:-unsigned}-ios.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: face-alot-ipa-unsigned
          path: '*.ipa'
      - name: Attach IPA to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: face_alot-*-ios.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
