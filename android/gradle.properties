# Local mạnh có thể tăng Xmx; CI workflow sẽ sed xuống 3G
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 + Firebase: bật built-in Kotlin (tránh lỗi KGP trên CI Flutter mới)
android.builtInKotlin=true
# Fix Windows C: pub-cache vs D: project incremental cache crash
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
